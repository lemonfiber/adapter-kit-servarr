[package]
name = "adapter-kit-servarr"
version = "0.18.0"
edition = "2021"
rust-version = "1.95"
repository = "https://github.com/lemonfiber/adapter-kit-servarr"
authors = ["NightWorks.io"]
license-file = "LICENSE"
description = "The client lemonfiber's Sonarr, Radarr, Lidarr and Prowlarr adapters share"
publish = false

[dependencies]
async-trait = "0.1"
jiff = { version = "0.2", default-features = false, features = ["std"] }
lemonfiber-adapter-kit = { git = "https://github.com/lemonfiber/lemonfiber", rev = "bf525eadbff0d58952f8e3b5013ef360a9d000ee" }
lemonfiber-contract = { git = "https://github.com/lemonfiber/lemonfiber", rev = "bf525eadbff0d58952f8e3b5013ef360a9d000ee" }
lemonfiber-error = { git = "https://github.com/lemonfiber/lemonfiber", rev = "bf525eadbff0d58952f8e3b5013ef360a9d000ee" }
lemonfiber-manifest = { git = "https://github.com/lemonfiber/lemonfiber", rev = "bf525eadbff0d58952f8e3b5013ef360a9d000ee" }
lemonfiber-ports = { git = "https://github.com/lemonfiber/lemonfiber", rev = "bf525eadbff0d58952f8e3b5013ef360a9d000ee" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
lemonfiber-fixtures = { git = "https://github.com/lemonfiber/lemonfiber", rev = "bf525eadbff0d58952f8e3b5013ef360a9d000ee" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
pedantic = { level = "warn", priority = -1 }
duration_suboptimal_units = "allow"

[profile.dev]
debug = "line-tables-only"
