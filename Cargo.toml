[package]
name = "adapter-kit-servarr"
version = "0.18.0"
edition = "2021"
rust-version = "1.95"
repository = "https://github.com/lemonfiber/adapter-kit-servarr"
authors = ["NightWorks.io"]
license-file = "LICENSE"
description = "The client lemonfiber's Sonarr, Radarr, Lidarr and Prowlarr adapters share"
publish = false

[dependencies]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
pedantic = { level = "warn", priority = -1 }
duration_suboptimal_units = "allow"

[profile.dev]
debug = "line-tables-only"
